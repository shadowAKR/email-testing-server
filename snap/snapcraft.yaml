name: postroom
version: '3.0.0'
summary: Local SMTP capture and email inspection
description: A Go and Wails desktop application for testing emails locally.
grade: stable
confinement: strict
base: core24

apps:
  postroom:
    command: postroom
    extensions: [gnome]
    plugs: [network, network-bind, home, removable-media]
    desktop: meta/gui/postroom.desktop

parts:
  postroom:
    plugin: dump
    source: .
    stage:
      - postroom
      - meta/gui/postroom.desktop
      - meta/gui/postroom.png
    organize:
      build/bin/postroom: postroom
      postroom.desktop: meta/gui/postroom.desktop
      assets/icon.png: meta/gui/postroom.png
    stage-packages:
      - libwebkit2gtk-4.1-0
